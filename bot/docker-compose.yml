services:
  grizlik:
    build: .
    container_name: grizlik
    env_file: .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./data:/app/data       # база SQLite переживает перезапуск и пересборку
    restart: unless-stopped
    init: true                  # корректная остановка по SIGTERM
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"